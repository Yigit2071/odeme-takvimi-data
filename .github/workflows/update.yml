name: Veriyi güncelle (TÜFE ve döviz kuru)

on:
  schedule:
    # Döviz kuru: TCMB kurları iş günleri 15:30'da (TR) açıklar → her iş günü 16:00'da (TR).
    - cron: '0 13 * * 1-5'
    # TÜFE: TÜİK her ayın 3'ünde 10:00'da açıklar; EVDS'ye yansıması ve hafta sonu kaymaları için
    # ayın 3-6'sı 12:00'de (TR) de dener. Veri değişmediyse hiçbir şey kaydedilmez.
    - cron: '0 9 3-6 * *'
  # GitHub'da Actions sekmesinden elle de çalıştırılabilir.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: EVDS'den TÜFE ve kurları çek
        run: node update-data.mjs remote-data.json
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}

      - name: Değiştiyse kaydet (GitHub Pages kendiliğinden yeniden yayınlar)
        run: |
          if git diff --quiet; then
            echo "Veri değişmedi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Veri güncellendi"
          git push
